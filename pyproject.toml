[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium"
dynamic = ["version"]
description = "A framework for running LLM inference across GPUs volunteered by geographically separated users."
readme = "Readme.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Varun Gambhir"}]
dependencies = [
    "websockets==17.0.1",
    "cryptography==50.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
node = [
    "ray[llm]==2.57.0",
    "vllm[audio]==0.25.1",
]
client = []
# Phase 3 stage node (issue #78). Same versions uv.lock already resolves
# through vllm; kept out of `node` so it installs on macOS for tests.
stage = [
    "torch==2.11.0",
    "transformers==5.15.0",
    "safetensors==0.8.0",
    "huggingface-hub==1.27.0",
]

[project.scripts]
mycelium-node = "mycelium.node.cli:main"
mycelium-coordinator = "mycelium.coordinator.cli:main"
mycelium-coordinator-status = "mycelium.coordinator.status_cli:main"
mycelium-coordinator-ban = "mycelium.coordinator.ban_cli:main"
mycelium-client = "mycelium.client.cli:main"
mycelium-client-models = "mycelium.client.models_cli:main"

[tool.setuptools.dynamic]
version = {attr = "mycelium.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# See docs/dependencies.md — must match nvidia-cuda-runtime/nvrtc's 13.0 line
constraint-dependencies = [
    "nvidia-cuda-nvcc==13.0.88",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
